<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Power Meme</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <video id="memeVideo" autoplay></video>

    <script>
      const video = document.getElementById("memeVideo");

      const params = new URLSearchParams(window.location.search);

      const volume = Number(params.get("volume") ?? 0.7);
      const videoPath = params.get("videoPath");

      video.volume = volume;

      if (videoPath) {
        const normalizedPath = videoPath.replace(/\\/g, "/");
        video.src = `file:///${normalizedPath}`;
      }

      video.addEventListener("ended", () => {
        window.close();
      });

      video.addEventListener("error", () => {
        window.close();
      });
    </script>
  </body>
</html>
